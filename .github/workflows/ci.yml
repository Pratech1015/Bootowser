name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patches:
    name: firefox patch series
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: every patch in the series exists and is listed in order
        run: |
          set -euo pipefail
          series=firefox/patches/series
          [ -s "$series" ] || { echo "::error::$series is empty"; exit 1; }
          n=0
          # `|| [ -n "$p" ]` so a series file with no trailing newline does not
          # silently drop its last patch.
          while read -r p || [ -n "$p" ]; do
            case "$p" in ''|\#*) continue ;; esac
            n=$((n + 1))
            # Compare the bare filename: `series` lists patch names, not paths.
            want=$(printf '%04d-' "$n")
            case "$p" in
              "$want"*) ;;
              *) echo "::error::series entry '$p' does not match prefix '$want'"
                 echo "         (patches must be numbered so they apply in order)"
                 exit 1 ;;
            esac
            [ -f "firefox/patches/$p" ] || {
              echo "::error::series references missing patch: $p"; exit 1; }
            echo "ok: $p"
          done < "$series"
          echo "$n patch(es) checked"

      - name: patches apply cleanly to the pinned Firefox
        env:
          FIREFOX_VERSION: FIREFOX_156_0_1_RELEASE
        run: |
          set -euo pipefail
          pinned=$(grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' \
                   firefox/FIREFOX_VERSION | head -n1 | tr -d '[:space:]')
          [ "$pinned" = "$FIREFOX_VERSION" ] || {
            echo "::error::FIREFOX_VERSION is '$pinned' but this job expects $FIREFOX_VERSION"
            echo "         update FIREFOX_VERSION in this workflow when bumping the release"
            exit 1
          }

          # Shallow, tag-only clone: enough to apply a patch series, and it
          # avoids the ~20 GB a full Firefox history would cost CI. No
          # --filter=blob:none: a partial clone turns every later checkout
          # into a lazy fetch that GitHub has been observed to drop
          # mid-transfer; one pack up front is the reliable shape.
          echo "::group::clone firefox $pinned"
          git clone --no-checkout --depth 1 \
            --branch "$pinned" https://github.com/mozilla-firefox/firefox.git \
            firefox-src
          echo "::endgroup::"

          ./firefox/apply-patches.sh --src-dir firefox-src --check

      - name: the series must actually carry the lockdown
        run: |
          set -euo pipefail
          # A patch series that stopped containing the lockdown would still
          # apply cleanly, so assert on the content, not just on the apply.
          grep -q -- '--enable-bootowser' firefox/patches/*.patch || {
            echo "::error::no patch defines --enable-bootowser"; exit 1; }
          grep -q 'CheckBootowserNavigation' firefox/patches/*.patch || {
            echo "::error::no patch enforces the navigation allowlist"; exit 1; }
          grep -q 'bootowser.build' firefox/patches/*.patch || {
            echo "::error::no patch gates on the bootowser.build static pref"; exit 1; }
          # The allow-list must keep the schemes Firefox loads into its own
          # top-level window. Dropping any of these does not fail to compile or
          # fail to apply -- it produces a browser that cannot draw its own UI,
          # cannot open a new tab, or cannot render a PDF. Only a launch catches
          # it, so assert on the list here.
          for scheme in chrome about:newtab about:home moz-extension; do
            grep -qF "$scheme" firefox/patches/0001-*.patch || {
              echo "::error::patch 0001 no longer allows '$scheme'"
              echo "         the built browser will fail to paint its own UI"
              exit 1; }
          done
          # The rebrand. Same reasoning: dropping these changes nothing about
          # whether the series applies, and the result is a binary that is
          # called firefox and titled Firefox.
          grep -q -- '--with-app-name=bootowser' firefox/mozconfig-bootowser || {
            echo "::error::mozconfig does not rename the executable"
            exit 1; }
          grep -q 'imply_option("MOZ_APP_VENDOR", "Bootowser")' firefox/patches/0003-*.patch || {
            echo "::error::patch 0003 no longer sets MOZ_APP_VENDOR"
            exit 1; }
          grep -q 'imply_option("MOZ_APP_PROFILE", "bootowser")' firefox/patches/0003-*.patch || {
            echo "::error::patch 0003 no longer sets MOZ_APP_PROFILE"
            exit 1; }
          grep -q 'MOZ_APP_DISPLAYNAME=Bootowser' firefox/patches/0003-*.patch || {
            echo "::error::patch 0003 no longer renames the display name"
            exit 1; }
          # The User Agent must stay Firefox. This one is a guard *against* a
          # rename that looks thorough: MOZ_APP_UA_NAME defaults to empty, which
          # makes the UA fall back to application.ini's Name, so "fixing" it to
          # Bootowser would serve every page bootowser/<version> and get the
          # kiosk treated as a bot.
          grep -q 'imply_option("MOZ_APP_UA_NAME", "Firefox")' firefox/patches/0003-*.patch || {
            echo "::error::patch 0003 no longer pins MOZ_APP_UA_NAME to Firefox"
            echo "         an empty value falls back to Name and changes the UA"
            exit 1; }
          # The launcher must not quietly run a distro browser: it has none of
          # the patches above, so the allow-list and the escape hatches go away.
          grep -q 'ALLOW_SYSTEM_BROWSER' runtime/bin/bootowser || {
            echo "::error::launcher no longer gates the system-browser fallback"
            exit 1
          }
          # The control sidecar. Same reasoning as above: a series that no
          # longer builds it still applies cleanly and still compiles, so the
          # assertions have to be on the content.
          grep -q 'GeckoProgram("bootowser-control"' firefox/patches/0006-*.patch || {
            echo "::error::patch 0006 no longer builds bootowser-control"
            exit 1; }
          grep -q 'toolkit/moz.build' firefox/patches/0006-*.patch || {
            echo "::error::patch 0006 no longer hooks toolkit/moz.build"
            exit 1; }
          grep -q '/v1/exec' firefox/patches/0006-*.patch || {
            echo "::error::patch 0006 no longer serves the /v1/exec endpoint"
            exit 1; }
          grep -q 'bootowser-control.service' runtime/lib/systemd/system/bootowser.service || {
            echo "::error::bootowser.service no longer pulls in the control sidecar"
            exit 1; }
          echo "lockdown and identity present in the series"

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: syntax check
        run: |
          set -euo pipefail
          for f in firefox/*.sh tools/*.sh runtime/bin/* \
                   runtime/lib/bootowser/commands/*.sh; do
            echo "::group::bash -n $f"
            bash -n "$f"
            echo "::endgroup::"
          done
          sh -n packaging/debian/postinst packaging/debian/postrm
          sh -n packaging/arch/bootowser.install
          bash -n packaging/arch/PKGBUILD packaging/debian/rules

      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck -s bash -S warning firefox/*.sh tools/*.sh runtime/bin/*
          shellcheck -s sh -S warning runtime/lib/bootowser/commands/*.sh
          # PKGBUILD: pkgdir/srcdir/depends etc. are injected by makepkg.
          shellcheck -s bash -S warning -e SC2034,SC2154 packaging/arch/PKGBUILD

      - name: sudoers fragment parses
        run: |
          set -euo pipefail
          # A fragment that does not parse is a root hook path that fails
          # exactly when it is needed. Run visudo as the checkout user: as
          # root it would also police ownership, and a git checkout is never
          # owned by root.
          visudo="$(command -v visudo || echo /usr/sbin/visudo)"
          "$visudo" -cf runtime/lib/sudoers.d/bootowser
          echo "sudoers fragment OK"

  config:
    name: configuration files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: managed policy is valid JSON with no stray keys
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          path = Path("runtime/etc/bootowser/policies/managed/policies.json")
          data = json.loads(path.read_text())
          # A key Firefox does not know at the top level is ignored with no
          # warning at all, so a stray one would sit there looking applied.
          stray = sorted(set(data) - {"policies", "BootowserManaged"})
          if stray:
              sys.exit(f"policy file has stray top-level keys: {stray}")
          pols = data.get("policies")
          if not isinstance(pols, dict) or not pols:
              sys.exit("policy file has no policies")
          # Firefox ignores unknown members silently, so a typo in a policy
          # name is a hole in the lockdown that nothing reports. The name list
          # is vendored so this check never depends on the network.
          names = Path("tools/firefox-policy-names.txt")
          if not names.is_file():
              sys.exit("vendored policy name list is missing")
          known = {ln.strip() for ln in names.read_text().splitlines()
                   if ln.strip() and not ln.startswith("#")}
          if not known:
              sys.exit("vendored policy name list is empty")
          bogus = sorted(set(pols) - known)
          if bogus:
              sys.exit(f"not real Firefox policies: {bogus}")
          print(f"ok: {len(pols)} policies, no stray keys")
          PY

      # The upstream cross-check that used to live here fetched the
      # mozilla/policy-templates README table. That table moved to the
      # Firefox Admin Docs and no longer ships in a machine-readable
      # place, so tools/firefox-policy-names.txt (checked in the step
      # above) is the authoritative name list. See its header for how to
      # refresh it when the Firefox pin is bumped.

      - name: every Preferences entry is a prefix Firefox will accept
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          # Mirrors the allowedPrefixes / allowedSecurityPrefs / blockedPrefs
          # tables in browser/components/enterprisepolicies/Policies.sys.mjs.
          # A preference outside these is dropped with only a console error,
          # so it looks applied in the policy but is not enforced.
          allowed = [
              "accessibility.", "alerts.", "app.update.", "browser.",
              "datareporting.policy.", "devtools.", "dom.", "extensions.",
              "general.autoScroll", "general.smoothScroll", "geo.", "gfx.",
              "identity.fxaccounts.toolbar.", "intl.", "keyword.enabled",
              "layers.", "layout.", "mathml.disabled", "media.", "network.",
              "pdfjs.", "places.", "pref.", "print.",
              "privacy.baselineFingerprintingProtection",
              "privacy.fingerprintingProtection",
              "privacy.globalprivacycontrol.enabled",
              "privacy.userContext.enabled", "privacy.userContext.ui.enabled",
              "sidebar.", "signon.", "spellchecker.",
              "svg.context-properties.content.enabled", "svg.disabled",
              "toolkit.legacyUserProfileCustomizations.stylesheets",
              "ui.", "webgl.disabled", "webgl.force-enabled", "widget.",
              "xpinstall.enabled", "xpinstall.whitelist.required",
          ]
          blocked = {
              "app.update.channel", "app.update.lastUpdateTime",
              "app.update.migrated", "browser.vpn_promo.disallowed_regions",
          }
          prefs = json.load(open(
              "runtime/etc/bootowser/policies/managed/policies.json"
          ))["policies"].get("Preferences", {})
          rejected = sorted(
              k for k in prefs
              if k in blocked or not any(k.startswith(p) for p in allowed)
          )
          if rejected:
              sys.exit(f"preferences Firefox will silently ignore: {rejected}")
          print(f"ok: all {len(prefs)} preferences are honoured by Firefox")
          PY

      - name: the policy file is marked as Bootowser-managed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          d = json.load(open(
              "runtime/etc/bootowser/policies/managed/policies.json"))
          # runtime/bin/bootowser greps for this marker before exec so that a
          # stale or foreign policy at the path which wins resolution cannot
          # leave the kiosk running unlocked.
          if d.get("BootowserManaged") is not True:
              sys.exit("policies.json is missing the BootowserManaged marker")
          print("ok: policy is marked BootowserManaged")
          PY

      - name: LNA checks are locked off for the local control API
        run: |
          set -euo pipefail
          # Firefox 156 gates http://127.0.0.1 fetches from https pages
          # behind Network Checks (Local Network Access). Left on, the kiosk
          # page's calls to the control sidecar are refused by the browser
          # and it looks like the API is broken. The sidecar cannot switch
          # this off itself: prefs must be locked by policy.
          python3 - <<'PY'
          import json, sys
          prefs = json.load(open(
              "runtime/etc/bootowser/policies/managed/policies.json"
          ))["policies"]["Preferences"]
          for key in ("network.lna.enabled", "network.lna.blocking"):
              p = prefs.get(key)
              if not p or p.get("Value") is not False \
                      or p.get("Status") != "locked":
                  sys.exit(f"{key} must be locked to false, got: {p}")
          print("ok: LNA checks locked off by policy")
          PY

      - name: control.conf keys are all read by the sidecar
        run: |
          set -euo pipefail
          # A key in control.conf that the sidecar never reads is a setting
          # the operator believes in and that silently does nothing. The
          # names appear as quoted getenv() arguments in patch 0006.
          keys=$(grep -oE '^[A-Z][A-Z0-9_]*=' runtime/etc/bootowser/control.conf \
                 | tr -d '=' | sort -u)
          used=$(grep -hoE '(getenv|GetEnvInt|GetEnvBool)\("[A-Z0-9_]+"' \
                 firefox/patches/0006-*.patch \
                 | sed -E 's/^[a-zA-Z_]+\("//; s/"$//' | sort -u)
          fail=0
          while read -r k; do
            [ -n "$k" ] || continue
            if ! grep -qx "$k" <<<"$used"; then
              echo "::error file=runtime/etc/bootowser/control.conf::$k is never read by bootowser-control"
              fail=1
            fi
          done <<<"$keys"
          [ "$fail" -eq 0 ] && echo "all $(grep -c . <<<"$keys") control keys are read"
          exit "$fail"

      - name: config parses and every key is consumed by the launchers
        run: |
          set -euo pipefail
          # Capture the name inside "${NAME", "${NAME:-default}" and
          # "${NAME#prefix}" alike. Matching only a complete "${...}" expansion
          # misses defaults, and the check then reports false positives.
          keys=$(grep -oE '^[A-Z][A-Z0-9_]*=' runtime/etc/bootowser/bootowser.conf \
                 | tr -d '=' | sort -u)
          used=$(grep -hoE '\$\{[A-Z_][A-Z0-9_]*' \
                   runtime/bin/bootowser runtime/bin/bootowser-xsession \
                 | sed 's/[$"{]//g' | sort -u)
          fail=0
          while read -r k; do
            [ -n "$k" ] || continue
            if ! grep -qx "$k" <<<"$used"; then
              echo "::error file=runtime/etc/bootowser/bootowser.conf::$k is never read by runtime/bin/"
              fail=1
            fi
          done <<<"$keys"
          [ "$fail" -eq 0 ] && echo "all $(grep -c . <<<"$keys") config keys are read"
          exit "$fail"

      - name: systemd units
        run: |
          set -euo pipefail
          # systemd-analyze verify fails if ExecStart does not exist, so lay
          # the runtime down the way install.sh does -- into a throwaway
          # --root, not onto the runner (or the developer's) live filesystem.
          # The browser binary itself is not needed for a syntax check, and
          # the control sidecar stub only has to exist for ExecStart and
          # ConditionPathExists to resolve.
          root=$(mktemp -d)
          trap 'rm -rf "$root"' EXIT
          install -d -m 0755 "$root/usr/lib/bootowser" "$root/usr/share/bootowser" \
                             "$root/usr/lib/systemd/system" \
                             "$root/etc/bootowser/policies/managed"
          # Older systemd-analyze verify (the runner's 255) builds a start
          # job while verifying and fails when the default dependency chain
          # reaches a target the throwaway root does not have; current
          # systemd (262) does not care. Stage the host's targets and
          # tmp.mount -- which basic.target Wants -- so either is satisfied.
          for f in /usr/lib/systemd/system/*.target \
                   /usr/lib/systemd/system/tmp.mount; do
            if [ -f "$f" ]; then
              install -m 0644 "$f" "$root/usr/lib/systemd/system/"
            fi
          done
          install -m 0755 runtime/bin/bootowser          "$root/usr/lib/bootowser/bootowser"
          install -m 0755 runtime/bin/bootowser-xsession "$root/usr/lib/bootowser/bootowser-xsession"
          install -m 0755 /bin/true                      "$root/usr/lib/bootowser/bootowser-control"
          install -m 0644 runtime/xorg/xorg.conf         "$root/usr/share/bootowser/xorg.conf"
          install -m 0644 runtime/etc/bootowser/bootowser.conf "$root/etc/bootowser/bootowser.conf"
          install -m 0644 runtime/etc/bootowser/control.conf   "$root/etc/bootowser/control.conf"
          install -m 0644 runtime/etc/bootowser/policies/managed/policies.json \
                           "$root/etc/bootowser/policies/managed/bootowser.json"
          install -m 0644 runtime/lib/systemd/system/bootowser.service \
                           "$root/usr/lib/systemd/system/bootowser.service"
          install -m 0644 runtime/lib/systemd/system/bootowser-xserver.service \
                           "$root/usr/lib/systemd/system/bootowser-xserver.service"
          install -m 0644 runtime/lib/systemd/system/bootowser-control.service \
                           "$root/usr/lib/systemd/system/bootowser-control.service"
          # Verify the wait-for-splash drop-in parses too: stage it so the
          # merged unit is what systemd-analyze sees.
          install -d -m 0755 "$root/etc/systemd/system/bootowser.service.d"
          install -m 0644 \
            runtime/lib/systemd/system/bootowser.service.d/wait-for-splash.conf \
            "$root/etc/systemd/system/bootowser.service.d/wait-for-splash.conf"
          systemd-analyze verify --root="$root" \
                                  /usr/lib/systemd/system/bootowser.service \
                                  /usr/lib/systemd/system/bootowser-xserver.service \
                                  /usr/lib/systemd/system/bootowser-control.service
          # bootowser.service must keep pulling the sidecar in: without
          # Wants=/After= the page loads before the API is listening.
          grep -q '^Wants=bootowser-control.service' \
               "$root/usr/lib/systemd/system/bootowser.service"
          grep -q '^After=bootowser-control.service' \
               "$root/usr/lib/systemd/system/bootowser.service"
          # And the base unit stays on the immediate path: the splash
          # ordering lives only in the drop-in staged above.
          grep -q '^After=bootowser-xserver.service$' \
               "$root/usr/lib/systemd/system/bootowser.service"
          echo "units verified"

      - name: install layout round-trips without root
        run: |
          set -euo pipefail
          # A throwaway prefix, with every root-only action skipped, so this
          # works on a stock CI runner. Proves install.sh lays the tree out as
          # documented and that no boot splash is installed.
          prefix=/tmp/bootowser-prefix
          rm -rf "$prefix"
          ALLOW_UNPRIVILEGED_TESTING=1 ./tools/install.sh \
            --prefix "$prefix" --no-mask-getty >/dev/null
          test -x "$prefix/lib/bootowser/bootowser"
          test -x "$prefix/lib/bootowser/bootowser-xsession"
          test -f "$prefix/share/bootowser/xorg.conf"
          test -f "$prefix/etc/bootowser/bootowser.conf"
          test -f "$prefix/etc/bootowser/control.conf"
          test -f "$prefix/etc/sudoers.d/bootowser"
          test -x "$prefix/lib/bootowser/commands/restart-kiosk.sh"
          test -x "$prefix/lib/bootowser/commands/whoami-root.sh"
          test -f "$prefix/lib/systemd/system/bootowser.service"
          test -f "$prefix/lib/systemd/system/bootowser-xserver.service"
          test -f "$prefix/lib/systemd/system/bootowser-control.service"
          grep -q '^Wants=bootowser-control.service' \
               "$prefix/lib/systemd/system/bootowser.service"
          # Bootowser must not install or configure a boot splash.
          test -z "$(find "$prefix" -ipath '*plymouth*' -print -quit)"
          # The default must be the immediate start: no ordering against a
          # boot splash, no udev-settle wait, no admin drop-in installed.
          # Directive-only matches: the units' comments name these units
          # while explaining why they are not ordered against.
          if grep -q '^After=.*plymouth-quit-wait' \
               "$prefix/lib/systemd/system/bootowser.service"; then
            echo "::error::bootowser.service waits for plymouth-quit-wait by default"
            exit 1
          fi
          if grep -q '^After=.*udev-settle' \
               "$prefix/lib/systemd/system/bootowser-xserver.service"; then
            echo "::error::bootowser-xserver.service orders after systemd-udev-settle"
            exit 1
          fi
          grep -q '^WantedBy=multi-user.target' \
            "$prefix/lib/systemd/system/bootowser.service"
          test ! -e "$prefix/etc/systemd/system/bootowser.service.d/wait-for-splash.conf"
          echo "install layout OK, no splash installed, starts immediately"

          # uninstall.sh must be able to clean up the same tree.
          ALLOW_UNPRIVILEGED_TESTING=1 ./tools/uninstall.sh \
            --prefix "$prefix" --purge --yes >/dev/null
          test -z "$(find "$prefix" -type f -print -quit)"
          echo "uninstall layout OK"

          # --wait-for-splash is the opt-in: same tree, plus the drop-in,
          # and uninstall takes the drop-in back out again.
          prefix=/tmp/bootowser-prefix-splash
          rm -rf "$prefix"
          ALLOW_UNPRIVILEGED_TESTING=1 ./tools/install.sh \
            --prefix "$prefix" --no-mask-getty --wait-for-splash >/dev/null
          grep -q 'plymouth-quit-wait' \
            "$prefix/etc/systemd/system/bootowser.service.d/wait-for-splash.conf"
          ALLOW_UNPRIVILEGED_TESTING=1 ./tools/uninstall.sh \
            --prefix "$prefix" --purge --yes >/dev/null
          test -z "$(find "$prefix" -type f -print -quit)"
          echo "wait-for-splash round-trip OK"

          # The dry-run escape hatch must stay confined to /tmp.
          if ALLOW_UNPRIVILEGED_TESTING=1 ./tools/install.sh --prefix /usr \
               >/dev/null 2>&1; then
            echo "::error::ALLOW_UNPRIVILEGED_TESTING accepted a prefix outside /tmp"
            exit 1
          fi
          echo "dry-run guard refuses non-/tmp prefixes"

      - name: debian source package metadata
        run: |
          set -euo pipefail
          cp -r packaging/debian /tmp/bootowser-debian
          cd /tmp/bootowser-debian
          test -f source/format && test -f control && test -f changelog
          test -x rules && test -x postinst && test -x postrm
