## Chromium version

```
$ cat browser/CHROMIUM_VERSION
```

## What broke

Paste the output of the verifier, which reports which patch and which
upstream file:

```
$ tools/verify-patches.sh
```

## Failing command

```
$ cd browser && ./apply-patches.sh --check
```

## Where the code went

If you already know, say where it is now. Chromium renames files constantly
and this is usually the whole fix:

- `chrome_switches.cc` — deleted; switches are now `constexpr` in headers
- `startup_utils.cc` — now `ui/startup/startup_utils.cc`
- `chrome/browser/ui/web_ui/` — gone
- `PreSandboxStartup()` — still in `chrome/app/chrome_main_delegate.cc`

