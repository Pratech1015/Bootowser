## How Firefox was installed

Which of these is true?

- [ ] distribution package (the default; `install.sh` with no `--browser`)
- [ ] a build from `firefox/fetch.sh`
- [ ] something else

If it is a local build, say whether the machine is short on disk. A partially
finished build produces a browser that starts and then renders nothing, which
looks like a Bootowser bug.

