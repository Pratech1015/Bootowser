# Bootowser control sidecar configuration.
#
# Read by systemd (EnvironmentFile= in bootowser-control.service) and passed
# to /usr/lib/bootowser/bootowser-control. KEY=VALUE, no shell expansion.
# Every key here must be read by the sidecar -- CI checks that.

# Loopback port for the API. Must stay unreachable from the network; BIND
# below is refused unless it is loopback (or ALLOW_NONLOOPBACK=1 says you
# really mean it).
PORT=29500
BIND=127.0.0.1

# Origins a browser page must present to reach /v1/*. Set this to the same
# origin the kiosk page is served from (it must match START_URL's origin in
# bootowser.conf, exactly: scheme, host and port).
# The sidecar also always accepts its own origin (http://127.0.0.1:PORT and
# http://localhost:PORT) so the built-in admin console works.
ALLOWED_ORIGINS=https://start.example.com

# Shared secret for callers that send no Origin header (curl, scripts).
# Empty means token-less callers are rejected. Any local process that can
# read this file could use it -- that is the same privilege as the kiosk
# user, so it buys origin-check ergonomics, not extra isolation.
TOKEN=

# Root hooks: root-owned, non-writable scripts run via `sudo -n` (the
# shipped /etc/sudoers.d/bootowser names exactly this directory).
COMMANDS_DIR=/usr/lib/bootowser/commands

# Per-request limits. timeout_ms= on a request clamps to
# [1, MAX_TIMEOUT_MS]; output beyond MAX_OUTPUT_BYTES per stream is dropped
# and flagged "truncated" in the response.
DEFAULT_TIMEOUT_MS=30000
MAX_TIMEOUT_MS=300000
MAX_OUTPUT_BYTES=1048576
MAX_BODY_BYTES=1048576

# Cap on simultaneously handled requests; extra callers get 503.
MAX_CONCURRENT=16

# 1 allows Origin-less /v1/* requests without a token. Keep 0 unless some
# local tooling cannot send either.
ALLOW_NO_ORIGIN=0

# 1 permits BIND to be a non-loopback address. That exposes a shell to
# everyone who can reach the port; there is no TLS and the origin check is
# not a credential for non-browser callers. Keep 0.
ALLOW_NONLOOPBACK=0
