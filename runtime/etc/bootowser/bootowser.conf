# Bootowser configuration.
#
# Installed to /etc/bootowser/bootowser.conf. Read by /usr/lib/bootowser/bootowser
# at every start. The format is deliberately dumb: KEY=VALUE, one per line,
# no shell expansion, no command substitution. Values are passed to the browser
# as command line switches, so anything not listed in EXTRA_SWITCHES below is
# ignored.
#
# Reload with: systemctl restart bootowser

# --- What to show ----------------------------------------------------------
# The URL loaded at boot. Must start with http:// or https://; file:// is
# refused by the launcher, because loading a local file as the kiosk page is a
# local read primitive with no legitimate kiosk use.
START_URL="https://start.example.com"

# --- Display ---------------------------------------------------------------
# NOTE: SCREEN_* are read by bootowser-xsession, which starts the bundled X
# server, not by the browser launcher itself.
# Backbuffer size for the built-in X server. "auto" picks a mode matching the
# connected panel; otherwise give explicit dimensions, e.g. 1920x1080.
SCREEN_SIZE="auto"
SCREEN_DEPTH=24
SCREEN_REFRESH=0

# --- Device ----------------------------------------------------------------
# Disable hardware acceleration when the GPU driver is unstable. Slower, but
# it is the difference between a working kiosk and a black screen.
DISABLE_GPU="no"

# Use the X11 software rasteriser instead of the GPU. Slower still.
# Gecko does not need this the way Chromium did: DISABLE_GPU=yes already sets
# LIBGL_ALWAYS_SOFTWARE, which selects llvmpipe. Kept for explicitness.
DISABLE_GPU_COMPOSITING="no"

# --- Power and boot behaviour ---------------------------------------------
# Seconds of idle time before the display blanks. 0 disables blanking.
IDLE_BLANK_MINUTES=0

# Suspend the machine when the kiosk has been idle for this many minutes.
# 0 disables it. Note that a suspended kiosk is not a running kiosk.
IDLE_SUSPEND_MINUTES=0

# There is deliberately no "allow exit" switch. A kiosk with a keyboard route
# out is not a kiosk. To recover a wedged device, switch to a TTY
# (Ctrl+Alt+F2..F6) and run:
#     systemctl stop bootowser
# See docs/architecture.md, "Recovering a wedged device".

# --- Advanced --------------------------------------------------------------
# Allow the launcher to fall back to a distro Firefox when the patched
# Bootowser build is not installed. Off by default and best left off: a distro
# browser has none of the patches, so the top-level navigation allow-list and
# the removed Ctrl+O / Ctrl+L / F12 hatches are simply absent, while the managed
# policy still applies and nothing tells you the difference. Set to 1 only to
# get a display back on a machine you are debugging.
ALLOW_SYSTEM_BROWSER="0"

# Extra browser switches, one per line as "switch" or "switch=value". Used
# for escape hatches, and passed straight through: Gecko has no launcher-side
# filter that strips dangerous switches, which is why the managed policy file
# and the source patches carry the lockdown instead. Treat this as
# root-writable-only.
EXTRA_SWITCHES=""
#EXTRA_SWITCHES="--lang=de
#--window-size=1920,1080"

# Keep the browser profile (cookies, cache) in this directory. Point it at a
# tmpfs if you do not want the session persisted to disk.
PROFILE_DIR="/var/lib/bootowser/profile"

# Where to write the browser log. "journal" exports MOZ_LOG so the browser logs
# to stderr and the output lands in the systemd journal; "none" leaves its own
# logging alone.
LOG_TARGET="journal"

# Gecko module logging. Ignored unless MOZ_LOG names a module; kept because the
# launcher only exports MOZ_LOG when LOG_TARGET is "journal".
LOG_LEVEL=1

# Print the sanitised command line and the lockdown decisions to the journal.
# Useful when bringing a new site up; noisy in production.
VERBOSE="no"