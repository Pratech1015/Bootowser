# Hold the browser until the boot splash has released the screen.
#
# Not active by default: bootowser.service starts the moment its display
# server is up. Install this drop-in on machines where the splash has to
# finish first -- a Plymouth theme with a LUKS passphrase prompt, or simply
# a theme you want to keep seeing to completion:
#
#     tools/install.sh --wait-for-splash
#
# or copy this file yourself:
#
#     install -Dm644 wait-for-splash.conf \
#         /etc/systemd/system/bootowser.service.d/wait-for-splash.conf
#     systemctl daemon-reload
#
# Drop-ins merge additively, so these After= lines add the ordering the base
# unit deliberately does not have. Listing units that do not exist is
# harmless (systemd ignores ordering against them), which is what keeps this
# drop-in working on Debian, Fedora and Arch alike -- including machines
# with no Plymouth at all, where it changes nothing.
[Unit]
After=plymouth-quit-wait.service systemd-user-sessions.service
