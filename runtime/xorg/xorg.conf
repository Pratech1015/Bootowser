# Xorg configuration for the Bootowser kiosk.
#
# Intent: the smallest X server that can show a fullscreen Chromium window.
# No window manager, no desktop, no network, no hardware cursor.
#
# Anything you change here applies to every device that installs the
# package. For per-device tuning, set SCREEN_SIZE in
# /etc/bootowser/bootowser.conf, which is passed to Xorg as "--mode".

Section "ServerFlags"
    Option "AutoAddGPU"        "off"
    Option "DontZap"           "true"
    Option "AutoReset"         "false"
    Option "DontVTSwitch"      "true"
    Option "AllowClosedOpenGL" "false"

Section "Files"
    # No modular driver search: the kernel modesetting driver is built in and
    # everything else is dead weight for a kiosk.
    FontPath   "none"
    ModulePath  "/usr/lib/xorg/modules"

Section "ServerLayout"
    Identifier  "Bootowser"
    Screen      "Bootowser-Screen" 0 0
    InputDevice "Bootowser-Input"  "CoreKeyboard"

Section "InputDevice"
    Identifier  "CoreKeyboard"
    Driver      "evdev"
    Option      "xkb_model"  "pc105"
    Option      "xkb_layout" "us"

Section "InputDevice"
    Identifier  "CorePointer"
    Driver      "evdev"
    Option      "AccelerationProfile" "none"

Section "Monitor"
    Identifier  "Bootowser-Monitor"
    Option      "DPMS"  "false"

Section "Device"
    Identifier  "Bootowser-Device"
    Driver      "modesetting"
    Option      "AccelMethod"  "glamor"
    Option      "Swapbuffers"  "true"

Section "Screen"
    Identifier "Bootowser-Screen"
    Device     "Bootowser-Device"
    Monitor    "Bootowser-Monitor"
    # Depth 24 with a 32-bit framebuffer: Chromium composites in ARGB and
    # expects a real alpha channel even though we never show transparency.
    DefaultDepth    24
    DefaultColorDepth 32
    SubSection "Display"
        Depth     24
        Virtual   8192 8192
    EndSubSection
    SubSection "Display"
        Depth     32
        Virtual   8192 8192
    EndSubSection
EndSection